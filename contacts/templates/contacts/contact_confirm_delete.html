{% extends 'contacts/base.html' %}

{% block title %}Supprimer {{ contact }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h3 class="card-title">Confirmation de suppression</h3>
            </div>
            <div class="card-body">
                <p>Êtes-vous sûr de vouloir supprimer le contact "{{ contact }}" ?</p>
                <p class="text-danger">Cette action est irréversible.</p>

                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-between">
                        <a href="{% url 'contacts:contact_list' %}" class="btn btn-secondary">Annuler</a>
                        <button type="submit" class="btn btn-danger">Confirmer la suppression</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
